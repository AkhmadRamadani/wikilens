version: '3.9'

services:
  wikilens:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: wikilens
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wikilens-net

  # Optional: nginx reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - wikilens
  #   networks:
  #     - wikilens-net

networks:
  wikilens-net:
    driver: bridge
